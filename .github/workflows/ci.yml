name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: MeterReaderKeeper.xcodeproj
  SCHEME: MeterReaderKeeper
  SPM_CACHE_PATH: .build/SourcePackages

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # "latest-stable" avoids hardcoding an Xcode version that may not
      # exist on this runner image by the time this runs — confirm with
      # `xcodebuild -version` in the logs below if a build ever behaves
      # unexpectedly.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode and available simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE_PATH }}
          key: spm-${{ runner.os }}-${{ hashFiles('MeterReaderKeeper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_PATH"

      # Picks whatever iPhone simulator happens to be available on this
      # runner image instead of hardcoding a device name/OS pair, which
      # tends to go stale as Xcode versions roll forward on GitHub's
      # hosted runners.
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Runs the scheme's default test plan (MeterReaderKeeper.xctestplan),
      # which covers both MeterReaderKeeperTests (unit) and
      # MeterReaderKeeperUITests (UI, parallelized across simulator
      # clones). The UI suite seeds a large fixture repeatedly, so this
      # step is the slow part of the job — see the note in chat about
      # runtime/cost before relying on this as a fast per-commit gate.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14
